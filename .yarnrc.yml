# Dependencies are pinned exactly, with no range prefix.
defaultSemverRangePrefix: ''

# Yarn defaults this to false, but 16 packages need build steps — including
# native ones (@swc/core, sharp, esbuild, @parcel/watcher).
enableScripts: true

# Several algoliasearch majors are installed side by side, each resolving its
# own @algolia/* versions.
nodeLinker: node-modules

# Storybook 5 lists `babel-loader` as a peer dependency but never depends on it,
# so nothing installs it next to the package that requires it. Declaring it here
# makes it a real dependency of each Storybook framework package, which is what
# its `require('babel-loader')` needs.
packageExtensions:
  '@storybook/core@5.3.9':
    dependencies:
      babel-loader: 8.2.2
  '@storybook/html@5.3.9':
    dependencies:
      babel-loader: 8.2.2
  '@storybook/vue@5.3.9':
    dependencies:
      babel-loader: 8.2.2

yarnPath: .yarn/releases/yarn-4.17.1.cjs
