name: CI

on:
  push:
    branches:
      - master
  pull_request:

# Cancel superseded runs on pull requests. Master pushes get a group of their
# own so they never queue behind each other: a concurrency group holds only one
# pending run, so a queued master run would be cancelled by the next merge even
# with `cancel-in-progress: false`, and a cancelled run never reaches
# `shipjs trigger`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build library
        run: yarn run build:ci

      - name: Test exports
        run: yarn run test:exports

      - name: Package build outputs
        run: |
          tar -cf build-outputs.tar \
            packages/algolia-experiences/dist \
            packages/algoliasearch-helper/dist \
            packages/instantsearch.js/es \
            packages/instantsearch.js/cjs \
            packages/instantsearch.js/dist \
            packages/react-instantsearch/dist \
            packages/react-instantsearch-core/dist \
            packages/react-instantsearch-router-nextjs/dist \
            packages/react-instantsearch-nextjs/dist \
            packages/vue-instantsearch/vue2 \
            packages/vue-instantsearch/vue3 \
            packages/instantsearch-ui-components/dist

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs
          path: build-outputs.tar
          retention-days: 1
          overwrite: true

  test-metadata:
    name: test metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Test package versions
        run: yarn run test:versions

  lint:
    name: lint
    needs: build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Format check
        run: |
          if yarn run format:check; then
            exit 0
          fi
          echo ""
          echo "=== Formatting violations (showing intended oxfmt output as diff) ==="
          yarn oxfmt . > /dev/null
          git --no-pager diff --color
          exit 1

      - name: Lint
        run: yarn run lint

      - name: Type checking
        run: yarn run type-check

  unit-tests:
    name: unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Unit tests
        env:
          INTEGRATION_TEST_APPID: ${{ secrets.INTEGRATION_TEST_APPID }}
          INTEGRATION_TEST_API_KEY: ${{ secrets.INTEGRATION_TEST_API_KEY }}
        run: yarn run test:ci

  legacy-algoliasearch-v3:
    name: legacy algoliasearch v3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Update dependencies
        run: ./scripts/legacy/downgrade-algoliasearch-dependency.js

      - name: Unit & integration tests
        run: yarn run test:v3

      - name: Type checking
        run: yarn run type-check:v3

  legacy-algoliasearch-v4:
    name: legacy algoliasearch v4
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Update dependencies
        run: ./scripts/legacy/downgrade-algoliasearch-v4.js

      - name: Unit & integration tests
        env:
          INTEGRATION_TEST_APPID: ${{ secrets.INTEGRATION_TEST_APPID }}
          INTEGRATION_TEST_API_KEY: ${{ secrets.INTEGRATION_TEST_API_KEY }}
        run: yarn run test:ci:v4

      - name: Type checking
        run: yarn run type-check:v4

  vue-v3:
    name: vue v3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Update dependencies
        run: yarn run prepare-vue3

      - name: Vue unit tests
        run: yarn run jest packages/vue-instantsearch --ci --maxWorkers=4

      - name: Vue 3 test exports
        run: yarn workspace vue-instantsearch run test:exports:vue3

  helper-docs:
    name: helper docs
    needs: build
    # TEMPORARY(ci-migration): also run on the migration branch so the
    # master-only path is validated in the PR. Revert before requesting review.
    if: github.ref == 'refs/heads/master' || github.head_ref == 'ci/github-actions-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Build helper documentation
        run: yarn workspace algoliasearch-helper run doc

  e2e:
    name: e2e
    # TEMPORARY(ci-migration): also run on the migration branch so the
    # master-only path is validated in the PR. Revert before requesting review.
    if: github.ref == 'refs/heads/master' || github.head_ref == 'ci/github-actions-migration'
    uses: ./.github/workflows/e2e.yml
    with:
      # IE11 and the Next.js suites report but never block, matching the
      # CircleCI release gate, which only required `e2e tests playwright`.
      # TEMPORARY(ci-migration): plain `true` once the shim above is reverted;
      # the PR run keeps honest red so every e2e job is actually validated.
      soft-fail-secondary: ${{ github.ref == 'refs/heads/master' }}
    secrets: inherit

  release-if-needed:
    name: release if needed
    needs:
      - build
      - lint
      - unit-tests
      - legacy-algoliasearch-v3
      - legacy-algoliasearch-v4
      - helper-docs
      - e2e
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FX_BOT_APP_ID }}
          private-key: ${{ secrets.FX_BOT_PRIVATE_KEY }}
          owner: algolia
          repositories: instantsearch

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Trigger a release if the latest commit is a release commit
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_INCOMING_HOOK: ${{ secrets.SLACK_INCOMING_HOOK }}
        run: yarn shipjs trigger
