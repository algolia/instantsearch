name: CI

on:
  push:
    branches:
      - master
  pull_request:
  # A prerelease, from whichever branch is picked here. Everything else in this
  # file still runs on a dispatch run — that is the point: `prerelease` needs
  # them, so a dispatch publishes from a green tree. Only Ship.js steps aside,
  # because a prerelease is not a stable release (see `release-if-needed`).
  workflow_dispatch:
    inputs:
      # There is no branch input on purpose: the branch selected for the dispatch
      # is the branch checked out and released, so the two cannot disagree.
      channel:
        description: Channel, which is also the npm dist-tag
        type: choice
        required: true
        default: beta
        options:
          - beta
          - alpha
          - rc
          - next
      action:
        description: plan bumps nothing and only reports; publish commits, tags, pushes and uploads
        type: choice
        required: true
        default: plan
        options:
          - plan
          - publish

# Cancel superseded runs on pull requests. Master pushes get a group of their
# own so they never queue behind each other: a concurrency group holds only one
# pending run, so a queued master run would be cancelled by the next merge even
# with `cancel-in-progress: false`, and a cancelled run never reaches
# `shipjs trigger`. Prerelease dispatches share one group, because two of them
# publishing at once would race for the same versions and the same dist-tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'workflow_dispatch' && 'prerelease' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build library
        run: yarn run build:ci

      - name: Test exports
        run: yarn run test:exports

      - name: Package build outputs
        run: |
          tar -cf build-outputs.tar \
            packages/algoliasearch-helper/dist \
            packages/instantsearch.js/es \
            packages/instantsearch.js/cjs \
            packages/instantsearch.js/dist \
            packages/react-instantsearch/dist \
            packages/react-instantsearch-core/dist \
            packages/react-instantsearch-router-nextjs/dist \
            packages/react-instantsearch-nextjs/dist \
            packages/vue-instantsearch/vue2 \
            packages/vue-instantsearch/vue3 \
            packages/instantsearch-ui-components/dist

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs
          path: build-outputs.tar
          retention-days: 1
          overwrite: true

  test-metadata:
    name: test metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Test package versions
        run: node ./tests/versions/index.js

  lint:
    name: lint
    needs: build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Format check
        run: |
          if yarn run format:check; then
            exit 0
          fi
          echo ""
          echo "=== Formatting violations (showing intended oxfmt output as diff) ==="
          yarn oxfmt . > /dev/null
          git --no-pager diff --color
          exit 1

      - name: Lint
        run: yarn run lint

      - name: Type checking
        run: yarn run type-check

  unit-tests:
    name: unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Unit tests
        env:
          INTEGRATION_TEST_APPID: ${{ secrets.INTEGRATION_TEST_APPID }}
          INTEGRATION_TEST_API_KEY: ${{ secrets.INTEGRATION_TEST_API_KEY }}
        run: yarn run test:ci

  legacy-algoliasearch-v3:
    name: legacy algoliasearch v3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Update dependencies
        run: ./scripts/legacy/downgrade-algoliasearch-dependency.js

      - name: Unit & integration tests
        run: yarn run test:v3

      - name: Type checking
        run: yarn run type-check:v3

  legacy-algoliasearch-v4:
    name: legacy algoliasearch v4
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Update dependencies
        run: ./scripts/legacy/downgrade-algoliasearch-v4.js

      - name: Unit & integration tests
        env:
          INTEGRATION_TEST_APPID: ${{ secrets.INTEGRATION_TEST_APPID }}
          INTEGRATION_TEST_API_KEY: ${{ secrets.INTEGRATION_TEST_API_KEY }}
        run: yarn run test:ci:v4

      - name: Type checking
        run: yarn run type-check:v4

  vue-v3:
    name: vue v3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Update dependencies
        run: yarn run prepare-vue3

      - name: Vue unit tests
        run: yarn run jest packages/vue-instantsearch --ci --maxWorkers=4

      - name: Vue 3 test exports
        run: yarn workspace vue-instantsearch run test:exports:vue3

  helper-docs:
    name: helper docs
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Unpack build outputs
        run: tar -xf build-outputs.tar && rm build-outputs.tar

      - name: Build helper documentation
        run: yarn workspace algoliasearch-helper run doc

  e2e:
    name: e2e
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/e2e.yml
    with:
      # The Next.js suites report but never block, matching the
      # CircleCI release gate, which only required `e2e tests playwright`.
      soft-fail-secondary: true
    secrets: inherit

  release-if-needed:
    name: release if needed
    needs:
      - build
      - lint
      - unit-tests
      - legacy-algoliasearch-v3
      - legacy-algoliasearch-v4
      - helper-docs
      - e2e
    # Never for a dispatch: that is a prerelease, and `master` being checked out
    # for one would otherwise let Ship.js publish a stable version alongside it.
    if: github.ref == 'refs/heads/master' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    outputs:
      released: ${{ steps.release-commit.outputs.released }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FX_BOT_APP_ID }}
          private-key: ${{ secrets.FX_BOT_PRIVATE_KEY }}
          owner: algolia
          repositories: instantsearch

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Trigger a release if the latest commit is a release commit
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_INCOMING_HOOK: ${{ secrets.SLACK_INCOMING_HOOK }}
        run: yarn shipjs trigger

      # The same signal `shipjs trigger` uses to decide whether to release, so
      # the gate and the release agree by construction. A prefix match and not
      # an equality check: the squash merge appends the pull request number, so
      # the real subject reads `chore: release (#7209)`.
      - name: Report whether a release happened
        id: release-commit
        run: |
          case "$(git log -1 --pretty=%s)" in
            "chore: release"*) printf 'released=true\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'released=false\n' >> "$GITHUB_OUTPUT" ;;
          esac

  # Called from here, and no longer triggered by the release tags: a Ship.js
  # release pushes one tag per changed package, and a tag trigger starts one run
  # per matched tag, so the templates used to build twice per release.
  release-templates:
    name: release templates
    needs: release-if-needed
    if: needs.release-if-needed.outputs.released == 'true'
    uses: ./.github/workflows/release-templates.yml
    secrets: inherit

  # A prerelease train from the dispatched branch: `scripts/release/release.mjs`
  # bumps every public package with Lerna's conventional-commits rules and
  # publishes it under the channel's dist-tag. It replaces Ship.js for this one
  # job — Ship.js 0.28 has no notion of a prerelease and its `publishCommand`
  # passes no `--tag`, so running it here would put a stable version on `latest`.
  # `latest` stays Ship.js's on `master`, and graduating a branch is still that
  # flow's job: merge it into `master` and `semver.inc` drops the prerelease.
  #
  # It is a job in this file rather than a workflow of its own because of npm.
  # Every package here has a trusted publisher naming `ci.yml` — visible in the
  # provenance of any published version, under `buildDefinition`'s
  # `externalParameters.workflow.path` — and npm validates the *calling*
  # workflow's filename, so publishing from here is signed with nothing to
  # configure. A new workflow file would need that form filled in by hand on
  # every package first, and npm publishes unsigned until it is.
  prerelease:
    name: prerelease ${{ github.event.inputs.channel }} (${{ github.event.inputs.action }})
    # Everything in this file except Ship.js's two jobs — which a prerelease
    # replaces — and except `legacy-algoliasearch-v3`. A `needs` entry has to name
    # a job the same file defines, and that one is a job a branch deletes when it
    # drops the support it tests (v5 does): naming it here would leave every run
    # on such a branch referring to a job that isn't there, which is a broken
    # file rather than one skipped job. It still runs on `master`, just without
    # blocking a prerelease.
    #
    # The two master-only jobs are in, so a prerelease dispatched against
    # `master` waits on them too. On any other branch they are skipped, and a job
    # that needs a skipped job is skipped itself — hence `!cancelled()` below,
    # which is also what lifts GitHub's own rule that a job only starts when
    # every dependency passed. The first step puts that rule back.
    needs:
      - build
      - test-metadata
      - lint
      - unit-tests
      - legacy-algoliasearch-v4
      - vue-v3
      - helper-docs
      - e2e
    if: github.event_name == 'workflow_dispatch' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The environment the packages' trusted publishers name. It has no required
    # reviewers, so the dispatch itself is the approval.
    environment: npm
    permissions:
      contents: read
      # The OIDC token Lerna trades for an npm token, and for provenance.
      id-token: write
    steps:
      # Skipped is fine — that is `helper-docs` and `e2e` on a branch that has
      # no use for them. Failed, timed out or cancelled is not, and the
      # `!cancelled()` above means GitHub no longer screens those out for us.
      # Better to find out here than after a version number has been spent.
      - name: Stop if CI did not pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const report = Object.entries(needs)
              .map(([job, { result }]) => `${job}=${result}`)
              .join(" ");
            const bad = Object.entries(needs)
              .filter(([, { result }]) => !["success", "skipped"].includes(result));
            console.log(`dependencies: ${report}`);
            for (const [job, { result }] of bad) {
              console.log(`::error::${job} ${result}`);
            }
            process.exit(bad.length ? 1 : 0);
          '

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FX_BOT_APP_ID }}
          private-key: ${{ secrets.FX_BOT_PRIVATE_KEY }}
          owner: algolia
          repositories: instantsearch

      # The dispatched branch, in full and on a real local branch: a dispatch
      # checks out a branch rather than a detached commit, which is what Lerna
      # needs — it refuses to version a detached HEAD, and it pushes with
      # `git push --follow-tags <remote> <branch>`. The full history, because the
      # bump is derived from the release tags.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      # Its own step so that a package npm will not let this run publish is a
      # named red step, and not a line inside a release that already spent a
      # version number. It runs for `plan` too: one token trade per package, and
      # on its own it answers "could we release from here at all".
      - name: Check that npm will accept this build
        env:
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/release/release.mjs --channel "$CHANNEL" --preflight

      - name: ${{ github.event.inputs.action }} the prerelease
        env:
          CHANNEL: ${{ inputs.channel }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          ARGS=(--channel "$CHANNEL" "--$ACTION")
          if [ "$ACTION" = 'publish' ]; then
            # The dispatch is the confirmation: it named a branch and a channel,
            # and the step above proved provenance is available here. Without that
            # proof the script refuses to publish.
            ARGS+=(--yes)
          fi

          node scripts/release/release.mjs "${ARGS[@]}"
