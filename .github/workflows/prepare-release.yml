name: Prepare Release

on:
  schedule:
    # Tuesdays at 09:00 UTC
    - cron: '0 9 * * 2'
  # Run it on `master` for the current major or `v4` for fixes on the previous
  # one; the branch picked is the branch the release pull request targets.
  workflow_dispatch:
    inputs:
      channel:
        description: stable, or a prerelease channel (also its npm dist-tag)
        type: choice
        required: true
        default: stable
        options:
          - stable
          - beta
          - alpha
          - rc
          - next

permissions:
  contents: read

jobs:
  prepare-release:
    name: prepare release
    runs-on: ubuntu-latest
    env:
      # A dispatch names its channel. The weekly run follows the repository
      # variable `RELEASE_CHANNEL`: set it to `beta` while `master` is on a beta
      # train, so the schedule ships betas instead of graduating the train.
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || vars.RELEASE_CHANNEL || 'stable' }}
    steps:
      - name: Only from a release branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            master|v4) ;;
            *) echo "::error::Releases are prepared from master or v4, not $BRANCH"; exit 1 ;;
          esac

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FX_BOT_APP_ID }}
          private-key: ${{ secrets.FX_BOT_PRIVATE_KEY }}
          owner: algolia
          repositories: instantsearch

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Prepare a pull request for next release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_INCOMING_HOOK: ${{ secrets.SLACK_INCOMING_HOOK }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ARGS=(--yes --no-browse)
          if [ "$CHANNEL" != 'stable' ]; then
            ARGS+=(--preid "$CHANNEL")
          elif [ "$EVENT" = 'workflow_dispatch' ]; then
            # Turning prereleases into stable versions only happens when
            # someone dispatches `stable` on purpose, never on the weekly
            # schedule (see `version` in `ship.config.mjs`).
            ARGS+=(--graduate)
          fi
          yarn run shipjs prepare "${ARGS[@]}"
