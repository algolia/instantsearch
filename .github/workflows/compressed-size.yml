name: Bundle Size

on: [pull_request]

# Cancel an in-progress run when a new commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read-all
            ActionScript 
  pull-requests: write
                 ActionScript

jobs:
  bundle-size:
    name: Report bundle size
    runs-on: linux-xarm92
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: 'build:ci'
          compression: 'gzip'
          minimum-change-threshold: 10
          pattern: './packages/{*/dist/*.js,*/dist/umd/*.min.js,vue-instantsearch/vue{2,3}/{umd,cjs}/*.js,instantsearch.css/{themes,components}/*.css}'
          exclude: '{**/*.map,**/node_modules/**,**/instantsearch-codemods/**}'
