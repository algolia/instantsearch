name: Documentation (release pull request)

# Per-change runs (see docs-feature.yml) document each user-facing change as it
# merges, onto this project's staging branch in docs-new. This workflow is the safety
# net and the shipper: sweep for anything those runs missed, then open one
# draft pull request for the release.

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      run_claude:
        description: 'Run the sweep (off = just open the PR for whatever is already staged)'
        default: true
        type: boolean
      create_pr:
        description: 'Create or update the pull request'
        default: false
        type: boolean
      max_turns:
        description: 'Turn budget per pass'
        default: 80
        type: number
      max_passes:
        description: 'Continuation passes before giving up'
        default: 3
        type: number

permissions:
  contents: read

env:
  # docs-new is shared across Algolia products, so keep the staging branch
  # namespaced rather than claiming something generic like `docs/next`.
  # Both docs workflows must agree on this value.
  DOCS_BRANCH_NAME: instantsearch/staging

concurrency:
  # The staging branch is shared mutable state - serialize everything that writes it
  group: instantsearch-docs-staging
  cancel-in-progress: false

jobs:
  release-docs:
    name: Sweep and open the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' || (startsWith(github.event.head_commit.message, 'chore:') && contains(github.event.head_commit.message, 'release'))


    steps:
      - name: Checkout instantsearch
        uses: actions/checkout@v4
        with:
          path: instantsearch
          # Enough history to find the previous `chore: release` commit
          fetch-depth: 200

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FX_BOT_APP_ID }}
          private-key: ${{ secrets.FX_BOT_PRIVATE_KEY }}
          owner: algolia
          repositories: docs-new

      - name: Checkout docs-new
        uses: actions/checkout@v4
        with:
          repository: algolia/docs-new
          token: ${{ steps.app-token.outputs.token }}
          path: docs-new
          # The staging branch lifecycle needs merge-base and cherry-pick
          # across branches, so shallow history is not enough.
          fetch-depth: 0

      - name: Prepare the staging branch
        env:
          DOCS_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: bash instantsearch/.github/scripts/docs-staging-prepare.sh

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install docs-new dependencies
        working-directory: docs-new
        run: npm ci

      # Deterministic and free. Every fact assembled here is a turn the agent
      # does not spend rediscovering it.
      - name: Build release context
        run: |
          set -euo pipefail
          OUT=/tmp/release-context.md
          SRC="${GITHUB_WORKSPACE}/instantsearch"
          DOCS="${GITHUB_WORKSPACE}/docs-new"
          : > /tmp/released-prs.txt

          {
            echo "## Release context (precomputed - do not re-read the changelogs)"
            echo
            echo "### Latest changelog entry per package"
            echo

            for pkg in instantsearch.js react-instantsearch react-instantsearch-core vue-instantsearch instantsearch-ui-components; do
              file="${SRC}/packages/${pkg}/CHANGELOG.md"
              [ -f "$file" ] || continue
              # From the first version heading up to, but not including, the next
              section=$(awk '/^#+ \[/ { n++ } n == 1' "$file")
              [ -n "$section" ] || continue
              echo "#### ${pkg}"
              echo
              echo "$section"
              echo
              # The first [#N] on a changelog bullet is its pull request; later
              # ones are the "closes" issue refs. `[^(]*` stops at the first
              # paren so those are not picked up.
              printf '%s\n' "$section" \
                | sed -nE 's/^\*[^(]*\(\[#([0-9]+)\].*/\1/p' >> /tmp/released-prs.txt
            done

            echo "### Library source files changed since the previous release"
            echo
            # No pipelines: an early `head`/`awk` exit SIGPIPEs git, and
            # pipefail turns that into a failed step.
            git -C "$SRC" log --format='%H %s' -n 200 > /tmp/git-log.txt
            prev=$(awk 'NR > 1 && /chore: release/ { print $1; exit }' /tmp/git-log.txt)
            if [ -n "${prev:-}" ]; then
              git -C "$SRC" diff --name-only "${prev}..HEAD" -- 'packages/*/src/*' ':(exclude)*__tests__*' > /tmp/changed-files.txt
              echo "Comparing \`${prev}\`..HEAD ($(wc -l < /tmp/changed-files.txt) files):"
              echo
              echo '```'
              head -n 300 /tmp/changed-files.txt
              echo '```'
            else
              echo "_Could not determine the previous release commit; rely on the changelogs above._"
            fi
            echo

            echo "## What the docs branch already covers"
            echo
            echo "Each entry below is one per-change documentation run that already landed"
            echo "on \`${DOCS_BRANCH}\`. Do not redo this work."
            echo
            git -C "$DOCS" log "origin/${DOCS_DEFAULT_BRANCH}..HEAD" --format='- %s' > /tmp/docs-log.txt
            if [ -s /tmp/docs-log.txt ]; then
              cat /tmp/docs-log.txt
            else
              echo "_Nothing yet - the per-change runs produced no documentation this cycle, so treat this as a full sweep._"
            fi
            echo
            echo "### Files the branch has already changed"
            echo
            git -C "$DOCS" diff --stat "origin/${DOCS_DEFAULT_BRANCH}...HEAD" > /tmp/docs-diffstat.txt
            if [ -s /tmp/docs-diffstat.txt ]; then
              echo '```'
              head -n 60 /tmp/docs-diffstat.txt
              echo '```'
            else
              echo "_No changes on the branch yet._"
            fi
          } > "$OUT"

          sort -u -o /tmp/released-prs.txt /tmp/released-prs.txt
          echo "Built $(wc -l < "$OUT") lines of release context."
          echo "This release publishes $(wc -l < /tmp/released-prs.txt) pull request(s)."
          cat "$OUT"

      - name: Add affected pages to the context
        run: bash instantsearch/.github/scripts/docs-guide-impact.sh /tmp/changed-files.txt /tmp/release-context.md

      - name: Sweep for undocumented changes
        id: agent
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_claude == true)
        # A partial sweep still ships: the pull request gets marked incomplete.
        continue-on-error: true
        uses: ./instantsearch/.github/actions/docs-agent
        with:
          prompt-file: ${{ github.workspace }}/instantsearch/.github/prompts/docs-release.md
          context-file: /tmp/release-context.md
          max-turns: ${{ inputs.max_turns || 80 }}
          max-passes: ${{ inputs.max_passes || 3 }}
          deadline-minutes: 25
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit the sweep to the staging branch
        id: commit
        if: >-
          always() && steps.agent.outputs.changed == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_pr == true))


        env:
          DOCS_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCS_FALLBACK_TITLE: 'fix(ui-libraries): update the InstantSearch docs for this release'
        run: bash instantsearch/.github/scripts/docs-staging-commit.sh

      - name: Show changes (no PR)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.create_pr == false
        working-directory: docs-new
        run: |
          echo "## Preview mode - no pull request created"
          echo ""
          if [[ -f ../agent-state/PROGRESS.md ]]; then
            echo "### Progress"; cat ../agent-state/PROGRESS.md; echo ""
          fi
          if [[ -f ../agent-state/CHANGES_SUMMARY.md ]]; then
            echo "### Summary"; cat ../agent-state/CHANGES_SUMMARY.md; echo ""
          fi
          echo "### Uncommitted changes"
          git status --short
          git diff || true
          echo ""
          echo "### Already on the branch"
          git log "origin/${DOCS_DEFAULT_BRANCH}..HEAD" --oneline || true

      - name: Open or update the release pull request
        id: pr
        if: >-
          always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_pr == true))


        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          AGENT_STATUS: ${{ steps.agent.outputs.status }}
          AGENT_VERIFY: ${{ steps.agent.outputs.verify }}
          AGENT_COST: ${{ steps.agent.outputs.cost }}
        working-directory: docs-new
        run: |
          set -euo pipefail

          if [ -z "$(git log "origin/${DOCS_DEFAULT_BRANCH}..HEAD" --oneline)" ]; then
            echo "::notice::${DOCS_BRANCH} has no commits beyond ${DOCS_DEFAULT_BRANCH}; nothing to open a pull request for."
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The branch title comes from the sweep when it made changes, and
          # otherwise from the accumulated per-change commits.
          TITLE="${{ steps.commit.outputs.title }}"
          if [ -z "$TITLE" ]; then
            COUNT=$(git log "origin/${DOCS_DEFAULT_BRANCH}..HEAD" --oneline | wc -l | tr -d ' ')
            if [ "$COUNT" -eq 1 ]; then
              TITLE=$(git log -1 --format=%s)
            else
              TITLE="fix(ui-libraries): update the InstantSearch docs for this release"
            fi
          fi

          BODY=$(mktemp)
          {
            echo "## Summary"
            echo
            echo "Documentation for the latest InstantSearch release, accumulated on"
            echo "\`${DOCS_BRANCH}\` as each change merged."
            echo
            git log "origin/${DOCS_DEFAULT_BRANCH}..HEAD" --format='- %s'
            echo

            if [ "${AGENT_STATUS:-}" = "incomplete" ]; then
              echo "## :warning: The release sweep did not finish"
              echo
              echo "It ran out of budget. What is here is worth reviewing, but the release"
              echo "may not be fully documented."
              echo
              echo "To finish locally:"
              echo
              echo '```bash'
              echo "gh pr checkout <this PR>"
              echo "claude \"Finish this docs update. Read PROGRESS.md below for what is left.\""
              echo '```'
              echo
              if [ -f ../agent-state/PROGRESS.md ]; then
                echo "<details><summary>PROGRESS.md</summary>"
                echo
                echo '```markdown'
                cat ../agent-state/PROGRESS.md
                echo '```'
                echo
                echo "</details>"
                echo
              fi
            fi

            if [ "${AGENT_VERIFY:-}" = "issues" ]; then
              echo "## :x: Checks are still failing"
              echo
              echo "Vale, link, tag-balance or navigation checks did not pass after the"
              echo "fix-up pass. docs-new's \`AGENTS.md\` asks that this stay in draft until"
              echo "they do. See the workflow run summary for the details."
              echo
            fi

            echo "## Source"
            echo "- [Release workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            if [ -n "${AGENT_COST:-}" ]; then
              echo "- Agent cost for the sweep: \$${AGENT_COST}"
            fi
            echo
            echo "## Review checklist"
            echo "- [ ] Every documented prop, default and signature matches the source"
            echo "- [ ] Code examples run"
            echo "- [ ] All affected flavors are covered (js, react, vue)"
            echo "- [ ] Vale and link checks pass"
            echo
            echo "---"
            echo "*Generated by [InstantSearch docs automation](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})*"
          } > "$BODY"

          EXISTING=$(gh pr list --repo algolia/docs-new --head "${DOCS_BRANCH}" --state open --json number --jq '.[0].number // ""')

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo algolia/docs-new --title "$TITLE" --body-file "$BODY"
            echo "Updated pull request #${EXISTING}."
            echo "number=${EXISTING}" >> "$GITHUB_OUTPUT"
          else
            # TODO: restore `--reviewer algolia/frontend-experiences-web` once the
            # frontend-experiences-bot app is granted (and an org owner approves)
            # the `Members: Read` permission it needs to resolve a team. Without
            # it the API returns 422 and fails the step after the pull request
            # has already been created.
            URL=$(gh pr create \
              --repo algolia/docs-new \
              --base "${DOCS_DEFAULT_BRANCH}" \
              --head "${DOCS_BRANCH}" \
              --title "$TITLE" \
              --body-file "$BODY" \
              --draft)
            echo "Opened ${URL}"
            echo "url=${URL}" >> "$GITHUB_OUTPUT"
            echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"
          fi
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # A documentation pull request can sit in review across several releases and
      # keep collecting commits, so it can come to document an API that is not
      # published yet. Say so on the pull request instead of leaving reviewers to
      # work it out.
      - name: Report release status on the docs pull request
        if: always() && steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          DOCS_TOKEN: ${{ steps.app-token.outputs.token }}
          AGENT_STATUS: ${{ steps.agent.outputs.status }}
          AGENT_VERIFY: ${{ steps.agent.outputs.verify }}
        run: |
          bash instantsearch/.github/scripts/docs-release-status.sh \
            "${{ steps.pr.outputs.number }}" /tmp/released-prs.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release documentation"
            echo
            echo "- **Branch:** \`${DOCS_BRANCH:-${DOCS_BRANCH_NAME}}\`"
            echo "- **Sweep status:** \`${{ steps.agent.outputs.status || 'not run' }}\`"
            echo "- **Checks:** \`${{ steps.agent.outputs.verify || 'not run' }}\`"
            echo
            if [[ "${{ steps.pr.outputs.opened }}" == "true" ]]; then
              if [[ -n "${{ steps.pr.outputs.number }}" ]]; then
                echo "Updated the existing draft pull request in algolia/docs-new."
              else
                echo "Opened a draft pull request in algolia/docs-new: ${{ steps.pr.outputs.url }}"
              fi
            else
              echo "No pull request: nothing was documented this cycle."
            fi
            if [[ "${{ steps.agent.outputs.status }}" == "incomplete" ]]; then
              echo
              echo ":warning: The sweep was cut short. The pull request is marked accordingly."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
